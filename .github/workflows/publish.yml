name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
        # NOTE: deliberately NOT setting `registry-url`. This workflow uses npm
        # Trusted Publishing (OIDC) with no NODE_AUTH_TOKEN. setup-node would
        # otherwise write `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
        # to .npmrc, and that empty token makes npm skip the OIDC exchange
        # (failing with ENEEDAUTH / 404).

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="$(node -p "require('./packages/react-dotlottie-player/package.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          echo "package.json version: $PKG_VERSION"
          echo "release tag version:  $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag (v$TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck --workspace=@mhmmt/react-dotlottie-player

      - name: Build
        run: npm run build --workspace=@mhmmt/react-dotlottie-player

      # Staged publishing: submits the package for review instead of publishing
      # directly. A maintainer approves it with 2FA to make it live. Requires
      # npm CLI >= 11.15.0 (Node 24 ships 11.19+).
      - name: Stage package
        run: npm stage publish --workspace=@mhmmt/react-dotlottie-player --access public --provenance

      - name: Approval instructions
        run: |
          {
            echo "### 📦 Package staged — awaiting approval"
            echo ""
            echo "A maintainer must approve this release with 2FA before it goes live:"
            echo ""
            echo "- npmjs.com → **@mhmmt/react-dotlottie-player** → **Staged Packages** → **Approve**"
            echo "- or CLI: \`npm stage list @mhmmt/react-dotlottie-player\` then \`npm stage approve <stage-id>\`"
          } >> "$GITHUB_STEP_SUMMARY"
